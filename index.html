<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#faf7f3"><title>あなたの本音、かくれんぼ診断</title><style>
:root{--bg:#faf7f3;--ink:#413a35;--muted:#716e67;--green:#667b69;--wine:#783d4a;--line:#eee5df;--card:#fffdfa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.8}main{max-width:690px;margin:auto;padding:22px 17px 64px}.hero{text-align:center;padding:35px 15px 29px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(155deg,#fffdfa,#f8f0ea)}.sprig{font-size:38px;letter-spacing:8px}.eyebrow{font-size:12px;color:var(--green);letter-spacing:.18em}.hero h1{font-family:serif;font-size:clamp(25px,6vw,38px);line-height:1.5;color:var(--wine);font-weight:500;margin:12px 0}.hero p{margin:5px 0;color:var(--muted);font-size:14px}.chip{display:inline-block;border:1px solid #d8ddd3;border-radius:30px;color:var(--green);font-size:12px;padding:3px 15px;margin-top:13px}.panel{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 20px}.intro{font-size:14px;color:var(--muted)}.question{padding:21px 0;border-bottom:1px solid var(--line)}.question:last-of-type{border-bottom:0}.num{color:var(--green);font-size:12px;font-weight:700;letter-spacing:.08em}.question h2{font-size:16px;line-height:1.7;margin:4px 0 14px;font-weight:600}.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}.answers label{display:flex;align-items:center;justify-content:center;min-height:49px;border:1px solid #e7dfd9;border-radius:12px;background:white;cursor:pointer;font-size:13px;text-align:center;padding:7px;transition:.15s}.answers input{position:absolute;opacity:0;pointer-events:none}.answers label:has(input:checked){background:#e7eee5;border:2px solid var(--green);color:#344e3b;font-weight:700}.answers label:focus-within{outline:2px solid var(--green);outline-offset:2px}.progress{position:sticky;top:0;z-index:2;background:rgba(250,247,243,.96);padding:12px 0 9px;font-size:12px;color:var(--muted)}.track{height:6px;border-radius:6px;background:#eae3dd;overflow:hidden;margin-top:7px}.fill{height:100%;width:0;background:var(--green);transition:width .2s}.button{width:100%;border:0;border-radius:40px;background:var(--wine);color:white;font-size:16px;font-weight:700;padding:15px 18px;cursor:pointer;margin-top:20px}.button:disabled{background:#b8b1ac;cursor:not-allowed}.button.secondary{background:var(--green)}.result{display:none;margin-top:22px;border:1px solid var(--line);background:#fffdfa;border-radius:20px;padding:28px 22px;text-align:center}.result.show{display:block}.result h2{font-family:serif;font-size:31px;font-weight:500;color:var(--wine);margin:10px 0}.result .symbol{font-size:58px}.result .subtitle{color:var(--green);font-weight:700}.result .body{text-align:left;margin-top:20px}.result .block{border-top:1px solid var(--line);margin-top:19px;padding-top:15px}.result h3{font-size:14px;color:var(--wine);margin:0 0 5px}.result p{margin:5px 0 0}.note{font-size:12px;color:var(--muted);margin-top:18px}.foot{text-align:center;font-size:12px;color:var(--muted);padding:25px 10px}.hide{display:none}@media(max-width:390px){.answers{grid-template-columns:1fr}.panel{padding:20px 16px}}@media print{.progress,.button{display:none}body{background:white}.result{display:block}}
</style></head><body><main><header class="hero"><div class="sprig" aria-hidden="true">🌿 ✿ 🌿</div><div class="eyebrow">わたしを知る、小さな時間</div><h1>あなたの本音、<br>かくれんぼ診断</h1><p>10の質問で見つける、今のあなたの心のクセ</p><span class="chip">全10問 ・ 約2〜3分 ・ 無料</span></header><section class="panel" id="quiz"><p class="intro">ここ1か月くらいの自分を思い浮かべて、いちばん近い答えを選んでね。正解も不正解もありません。🌷</p><div class="progress" aria-live="polite"><span id="count">0 / 10 問回答済み</span><div class="track"><div class="fill" id="fill"></div></div></div><form id="form"></form><button class="button" id="submit" disabled>診断結果を見る 🌷</button></section><section class="result" id="result" aria-live="polite" tabindex="-1"></section><footer class="foot">この診断は自己理解のきっかけをつくるオリジナルコンテンツです。<br>心理学的に検証された検査や医療的な診断ではありません。<br>回答内容は外部に送信・保存されません。</footer></main><script>
const questions=[
['相手と意見が違うとき、自分の考えを言わずに合わせることがある','花畑'],
['本当は気が進まなくても、頼まれると断りづらい','花畑'],
['自分の希望を伝えると、相手にどう思われるか気になる','花畑'],
['疲れていても、人に頼るより自分で何とかしようとする','山'],
['休んでいると「何かしなきゃ」と落ち着かなくなる','山'],
['周囲の期待に応えようとして、無理をすることがある','山'],
['やりたいことがあっても、失敗を考えて踏み出せない','森'],
['何かを決めるとき、周りの反応や結果を考えすぎて迷う','森'],
['「何がしたい？」と聞かれても、自分の希望が思い浮かばないことがある','湖'],
['好きなものや自分の気持ちが、よくわからなくなることがある','湖']
];
const labels=['ほとんどない','あまりない','ときどきある','よくある'];
const info={
'花畑':{emoji:'🌸',sub:'周りを大切にする、優しい調和の人',intro:'色とりどりの花が咲く花畑のように、周囲の気持ちを感じ取り、みんなが心地よく過ごせるように気を配れるあなた。',habit:'相手を大切にするあまり、「嫌われたくない」「がっかりさせたくない」と自分の希望を後回しにしてしまうことがあるかもしれません。',ask:'誰にも遠慮しなくていいなら、本当は何を選びたい？',step:'今日、ひとつだけ「私はこっちがいいな」と自分の希望を伝えてみよう。'},
'山':{emoji:'⛰️',sub:'責任感が強く、周りを支える頑張り屋さん',intro:'どっしりとそびえる山のように、頼られると力を発揮できるあなた。自分の役割を大切にして、最後までやり遂げようとする人。',habit:'いつの間にか「私がやらなきゃ」が当たり前になって、人に頼ることや休むことに申し訳なさを感じていませんか？',ask:'もし頑張らなくても大切にされるとしたら、今日はどう過ごしたい？',step:'ひとつだけ誰かにお願いするか、やらなくてもいいことを手放してみよう。'},
'森':{emoji:'🌳',sub:'深く考え、物事を丁寧に見つめる人',intro:'木々が重なり合う森のように、さまざまな可能性を考えられるあなた。慎重さや物事を見極める力を持っている人。',habit:'正解を探し続けるうちに、失敗や周囲の反応が気になって「やってみたい」という気持ちをしまい込んでしまうことがあるかもしれません。',ask:'もし失敗しても大丈夫なら、何をしてみたい？',step:'完璧に準備できていなくても、気になることを5分だけやってみよう。'},
'湖':{emoji:'🫧',sub:'柔軟で、周りを受け入れられる人',intro:'周囲の景色を映し出す湖のように、いろいろな価値観を受け止められるあなた。相手に合わせる柔軟さが魅力のひとつ。',habit:'「何でもいいよ」が当たり前になって、自分の好き嫌いや本当の希望を考える機会が少なくなっているのかもしれません。',ask:'最近、誰かの意見を聞く前に「これがいい！」と思ったことは何？',step:'食べたいものや飲みたいものを、誰にも相談せず自分でひとつ選んでみよう。'},
'晴れ':{emoji:'☀️',sub:'自分の気持ちと、仲良くできている人',intro:'晴れた空のように、自分の気持ちを見つめながら、周囲とのバランスも大切にできているあなた。',habit:'今のあなたは、自分の希望を比較的素直に受け止められているようです。これからも自分の心の声を大切にしてね。',ask:'これからの人生で、もっと大切にしていきたいことは何？',step:'最近「自分で選んでよかった」と感じたことを、ひとつ書き留めてみよう。'}
};
const form=document.getElementById('form');questions.forEach(([q],i)=>{const section=document.createElement('section');section.className='question';const h=document.createElement('h2');h.innerHTML='<span class="num">QUESTION '+String(i+1).padStart(2,'0')+'</span><br>';h.append(document.createTextNode(q));section.append(h);const choices=document.createElement('div');choices.className='answers';labels.forEach((label,n)=>{const l=document.createElement('label');const input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=n;input.setAttribute('aria-label',label);l.append(input,document.createTextNode(label));choices.append(l)});section.append(choices);form.append(section)});
const result=document.getElementById('result'),button=document.getElementById('submit');form.addEventListener('change',()=>{const done=questions.filter((_,i)=>form.querySelector('input[name="q'+i+'"]:checked')).length;document.getElementById('count').textContent=done+' / 10 問回答済み';document.getElementById('fill').style.width=(done*10)+'%';button.disabled=done!==10;result.classList.remove('show')});
function block(title,content){const el=document.createElement('div');el.className='block';const h=document.createElement('h3');h.textContent=title;const p=document.createElement('p');p.textContent=content;el.append(h,p);return el}
function render(){const values=questions.map((_,i)=>Number(form.querySelector('input[name="q'+i+'"]:checked').value));const total=values.reduce((a,b)=>a+b,0);const names=['花畑','山','森','湖'];const scores=names.map(name=>{const relevant=values.filter((_,i)=>questions[i][1]===name);return relevant.reduce((a,b)=>a+b,0)/relevant.length});const max=Math.max(...scores);const top=names.filter((_,i)=>Math.abs(scores[i]-max)<1e-9);const winner=total<=7?['晴れ']:top;result.replaceChildren();const mark=document.createElement('div');mark.className='symbol';mark.textContent=winner.length===1?info[winner[0]].emoji:'🌿';const small=document.createElement('div');small.className='eyebrow';small.textContent='YOUR RESULT';const title=document.createElement('h2');title.textContent=winner.join(' × ')+'タイプ';result.append(small,mark,title);if(winner.length===1){const x=info[winner[0]];const sub=document.createElement('div');sub.className='subtitle';sub.textContent=x.sub;const body=document.createElement('div');body.className='body';const intro=document.createElement('p');intro.textContent=x.intro;body.append(intro,block('あなたの本音の隠しグセ',x.habit),block('本音に気づく質問',x.ask),block('今日からの小さな一歩',x.step));result.append(sub,body)}else{const p=document.createElement('p');p.textContent='今のあなたには、複数の傾向が同じくらい見られるようです。どちらもあなたの大切な一面。気になる方から読んでみてね。';result.append(p);const body=document.createElement('div');body.className='body';winner.forEach(name=>{const x=info[name];body.append(block(x.emoji+' '+name+'タイプ',x.intro+' '+x.habit),block('小さな一歩',x.step))});result.append(body)}const footer=document.createElement('p');footer.className='note';footer.textContent='結果は今の傾向を振り返るための目安です。あなたの性格を決めつけるものではありません。';result.append(footer);const again=document.createElement('button');again.className='button secondary';again.textContent='もう一度診断する';again.addEventListener('click',()=>{form.reset();result.classList.remove('show');document.getElementById('count').textContent='0 / 10 問回答済み';document.getElementById('fill').style.width='0%';button.disabled=true;document.getElementById('quiz').scrollIntoView({behavior:'smooth'})});result.append(again);result.classList.add('show');result.scrollIntoView({behavior:'smooth',block:'start'});result.focus({preventScroll:true})}
button.addEventListener('click',render);
</script></body></html>
